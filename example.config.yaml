# Offline-dev EdgeConfig — bypasses cloud polling when EDGE_STATIC_CONFIG_PATH points here.
#
# Usage:
#   1. Generate demo frames:   python scripts/make_demo_frames.py --out ./demo/frames --count 10
#   2. Run the edge:           $env:EDGE_STATIC_CONFIG_PATH = "./example.config.yaml"; prosper-edge
#
# The structure mirrors the `EdgeConfig` schema in contracts/openapi.yaml so it stays
# wire-compatible with the cloud-issued version.

schema_version: "0.1.0"
device_id: edge-dev-001
issued_at: "2026-05-11T00:00:00Z"

cameras:
  # Real USB camera plugged into the Jetson — V4L2 backend (no GStreamer
  # required for plain UVC). To go back to the offline demo-frames camera,
  # change source_uri to "file://./demo/frames".
  - camera_id: usb-cam-1
    source_uri: "/dev/video0"
    role: general
    shed_id: shed-1
    zone_id: zone-A
    flock_id: flock-A
    flock_age_days: 28           # used by weight-estimator heuristic
    breed: ross_308              # used by weight-estimator heuristic

sensors:
  # Simulator-protocol sensors run entirely inside the edge process — no broker
  # required. Use these for the zero-dependency demo.
  # `thresholds` feed the SensorOutOfRangeRule. Values outside [min, max] raise
  # an alert (deduped per sensor by the rule's cooldown).
  - sensor_id: sim-temp-1
    sensor_type: temperature
    shed_id: shed-1
    zone_id: zone-A
    source: { protocol: simulator }
    thresholds: { min: 18, max: 30 }       # °C — comfortable broiler range
  - sensor_id: sim-hum-1
    sensor_type: humidity
    shed_id: shed-1
    zone_id: zone-A
    source: { protocol: simulator }
    thresholds: { min: 40, max: 75 }       # %RH
  - sensor_id: sim-nh3-1
    sensor_type: ammonia
    shed_id: shed-1
    zone_id: zone-A
    source: { protocol: simulator }
    thresholds: { min: 0, max: 20 }        # ppm — ≥25 ppm is harmful

  # MQTT-protocol sensors are picked up by the MqttSensorReader. Spin up the
  # broker (docker-compose.dev.yml) + scripts/mqtt_sensor_publisher.py to feed
  # these. The unit field is authoritative — publishers can't override it.
  # Uncomment to enable:
  # - sensor_id: mqtt-temp-1
  #   sensor_type: temperature
  #   unit: celsius
  #   shed_id: shed-1
  #   source:
  #     protocol: mqtt
  #     topic: prosper/sensors/shed-1/temp-1

ai:
  # One frame per second — snappy dashboard updates, easy on the Orin NX GPU.
  # Drop to 0.5 (2 fps) for closer-to-video feel, raise to 2.0 to save power.
  frame_interval_seconds: 1.0
  models:
    # Real YOLO from models/bird-detector/v1.0.0/model.pt. The inference
    # factory sees the .pt extension and dispatches to UltralyticsBirdDetector
    # → torch.cuda on the Jetson iGPU. Falls back to the stub automatically
    # if the artifact is missing (look for `StubBirdDetector` in boot logs).
    - name: bird-detector
      version: "1.1.0"
    # Heuristic weight estimator works out of the box (no artifact required).
    - name: weight-estimator
      version: "0.1.0"
    # DBSCAN huddling detector — also config-only, no artifact required.
    - name: huddling-detector
      version: "0.1.0"

sync:
  heartbeat_interval_seconds: 30
  batch_size: 50
  flush_interval_seconds: 5
