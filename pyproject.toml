[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prosper-edge"
version = "0.1.0"
description = "Prosper PoultryVision AI — EdgeBox runtime for on-shed AI inference and IoT ingestion"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Prosper Infotech" }]

# ── Core runtime: kept lean. Heavier capabilities are extras below. ──
dependencies = [
    "anyio>=4.4",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "aiosqlite>=0.20",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "tenacity>=8.3",          # retry policies for cloud sync
    "python-jose[cryptography]>=3.3",  # device JWT
]

[project.optional-dependencies]
# AI inference. Big wheels — only install where models actually run.
ai = [
    "opencv-python-headless>=4.10",
    "onnxruntime>=1.18",
    "ultralytics>=8.2",       # for training/export; runtime uses ONNX
    "scikit-learn>=1.5",      # DBSCAN for huddling
]
# IoT sensors.
sensors = [
    "paho-mqtt>=2.1",
    "pymodbus>=3.6",
]
# Dev/test tooling.
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml",
    "jsonschema>=4.22",       # contract validation in tests
    "pre-commit>=3.7",
    "respx>=0.21",            # httpx mocking
]

[project.scripts]
prosper-edge = "edge.main:run"

# ── Tooling config ──
[tool.hatch.build.targets.wheel]
packages = ["src/edge"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101"]  # allow asserts in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=edge --cov-report=term-missing"
markers = [
    "integration: end-to-end pipeline tests (may require docker)",
    "ai: tests that load real AI models",
]
